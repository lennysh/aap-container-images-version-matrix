---

- name: Find all digest vars directories
  ansible.builtin.find:
    paths: "{{ image_inspector_output_dir }}"
    patterns: "{{ image_inspector_vars_subdir }}"
    file_type: directory
    recurse: true
  register: vars_dirs

- name: Filter vars directories to configured image paths
  ansible.builtin.set_fact:
    details_vars_dirs: >-
      {{
        vars_dirs.files
        | selectattr(
            'path',
            'search',
            '^'
            ~ (image_inspector_output_dir | regex_escape)
            ~ '/('
            ~ (image_inspector_image_paths | map('regex_escape') | join('|'))
            ~ ')/'
            ~ (image_inspector_vars_subdir | regex_escape)
            ~ '$'
          )
        | list
      }}

- name: Initialize digests needing re-inspection
  ansible.builtin.set_fact:
    digests_needing_update: []

- name: Collect digests needing re-inspection (bulk load per image path)
  ansible.builtin.include_tasks: _details_collect_stale.yml
  loop: "{{ details_vars_dirs }}"
  loop_control:
    loop_var: __vars_dir
    label: "{{ __vars_dir.path | regex_replace('^' ~ image_inspector_output_dir ~ '/', '') }}"

- name: Report digests needing re-inspection
  ansible.builtin.debug:
    msg: >-
      {{ digests_needing_update | length }} digest(s) need re-inspection
      (of {{ details_vars_dirs | length }} image path(s)).

- name: Process digests needing re-inspection
  ansible.builtin.include_tasks: _details_file_process.yml
  loop: "{{ digests_needing_update }}"
  loop_control:
    loop_var: __work
    label: "{{ __work.image_path }}@{{ __work.image.digest[-12:] }}"
  when: digests_needing_update | length > 0
