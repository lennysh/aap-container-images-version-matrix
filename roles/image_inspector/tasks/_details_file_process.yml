---
# Expects __work: { image, image_path, vars_file } from details.yml pre-filter.

- name: Set current_data for image update tasks
  ansible.builtin.set_fact:
    image: "{{ __work.image }}"
    current_data:
      image_path: "{{ __work.image_path }}"
    processed_images: []

- name: Inspect details for digest
  ansible.builtin.include_tasks: _details_image_update.yml

- name: Save updated digest vars file
  ansible.builtin.template:
    src: digest_var.yml.j2
    dest: "{{ __work.vars_file }}"
    mode: '0644'
  vars:
    digest_record: "{{ processed_images[0] }}"
