---
# This file is looped over for each discover_image_path

- name: "Discovering images for: {{ discover_image.path }}"
  vars:
    discover_image_path: "{{ discover_image.path }}"
    vars_dir: "{{ image_inspector_output_dir }}/{{ discover_image.path }}/{{ image_inspector_vars_subdir }}"
    discover_exclude_patterns: "{{ discover_image.exclude_patterns }}"
  block:
    - name: Ensure vars output directory exists
      ansible.builtin.file:
        path: "{{ vars_dir }}"
        state: directory
        mode: '0755'

    # 1. List tags (skopeo list-tags) + parallel inspect, aggregated by digest
    - name: List tags and inspect in parallel
      discover_remote_digests:
        image: "{{ discover_image_path }}"
        exclude_patterns: "{{ discover_exclude_patterns }}"
        jobs: "{{ image_inspector_skopeo_jobs }}"
        retries: "{{ image_inspector_skopeo_retries }}"
        retry_delay: "{{ image_inspector_skopeo_retry_delay }}"
        retry_backoff: "{{ image_inspector_skopeo_retry_backoff }}"
      register: remote_inspect

    - name: Warn about permanently rejected tags
      ansible.builtin.debug:
        msg: >-
          {{ remote_inspect.permanent_failed_tags | length }} tag(s) rejected by
          registry policy (excluded from transient failures):
          {{ remote_inspect.permanent_failed_tags[:20] }}{{ '...' if (remote_inspect.permanent_failed_tags | length) > 20 else '' }}.
          Errors: {{ remote_inspect.permanent_failed_tag_errors }}
      when: remote_inspect.permanent_failed_tags | default([]) | length > 0

    - name: Warn about tags that failed inspect after retries
      ansible.builtin.debug:
        msg: >-
          {{ remote_inspect.failed_tags | length }} tag(s) failed skopeo inspect
          after retries and will be preserved on existing digests:
          {{ remote_inspect.failed_tags[:20] }}{{ '...' if (remote_inspect.failed_tags | length) > 20 else '' }}.
          Errors: {{ remote_inspect.failed_tag_errors }}
      when: remote_inspect.failed_tags | length > 0

    - name: Fail when tag inspects remain incomplete
      ansible.builtin.fail:
        msg: >-
          Discover incomplete for {{ discover_image_path }}:
          {{ remote_inspect.failed_tags | length }} tag(s) still failed after
          retries ({{ image_inspector_skopeo_retries }}). Refusing to continue
          with a possibly incomplete remote digest set.
          Failed: {{ remote_inspect.failed_tags }}
          Errors: {{ remote_inspect.failed_tag_errors }}
          Tip: lower image_inspector_skopeo_jobs, raise
          image_inspector_skopeo_retries, or set
          image_inspector_fail_on_failed_tags=false to preserve tags and skip
          prune instead of failing.
      when:
        - image_inspector_fail_on_failed_tags | bool
        - remote_inspect.failed_tags | length > 0

    - name: Set remote images by digest
      ansible.builtin.set_fact:
        remote_images_by_digest: "{{ remote_inspect.images_by_digest }}"
        remote_failed_tags: "{{ remote_inspect.failed_tags }}"
        remote_listed_tags: "{{ remote_inspect.tags }}"

    # 2. Load existing per-digest vars files (one task per image path)
    - name: Load all existing digest vars files
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
        extensions:
          - yml
        ignore_files:
          - .merged_tmp.yml
        name: _digests_by_hex

    - name: Build existing images by digest dictionary
      ansible.builtin.set_fact:
        existing_images_by_digest: >-
          {{ dict(
               (_digests_by_hex.values() | map(attribute='digest') | list)
               | zip(_digests_by_hex.values() | list)
             ) }}

    # 3. Write only new digests or digests whose image_tags changed.
    #    Tags that failed inspect are kept on their existing digest so a
    #    transient registry error cannot delete live tags from vars files.
    - name: Build digest records that need writing
      vars:
        _digests_to_write: >-
          {%- set ns = namespace(items=[]) -%}
          {%- set failed = remote_failed_tags | default([]) | map('string') | list -%}
          {%- for digest, remote in remote_images_by_digest.items() -%}
            {%- set existing = existing_images_by_digest[digest] | default(none) -%}
            {%- set remote_tags = remote.image_tags | default([]) | map('string') | list -%}
            {%- if existing is none -%}
              {%- set _ = ns.items.append({
                    'digest': digest,
                    'image_tags': remote_tags | sort,
                    'created': remote.created
                  }) -%}
            {%- else -%}
              {%- set existing_tags = (
                    existing.image_tags | default(existing.tags | default([]))
                    | map('string') | list
                  ) -%}
              {%- set preserved = existing_tags | select('in', failed) | list -%}
              {%- set merged_tags = (remote_tags + preserved) | unique | list | sort -%}
              {%- if (existing_tags | sort) != merged_tags -%}
                {%- set _ = ns.items.append(
                      existing | combine({'image_tags': merged_tags})
                    ) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.items }}
      ansible.builtin.set_fact:
        digests_to_write: "{{ _digests_to_write }}"

    - name: Report discover write plan
      ansible.builtin.debug:
        msg: >-
          {{ digests_to_write | length }} digest(s) to write
          ({{ remote_images_by_digest | length }} remote,
          {{ existing_images_by_digest | length }} existing,
          {{ remote_listed_tags | length }} tags inspected,
          {{ remote_failed_tags | length }} failed).

    - name: Write new or changed digest vars files
      ansible.builtin.template:
        src: digest_var.yml.j2
        dest: "{{ vars_dir }}/{{ item.digest | regex_replace('^sha256:', '') }}.yml"
        mode: '0644'
      vars:
        digest_record: "{{ item }}"
      loop: "{{ digests_to_write }}"
      loop_control:
        label: "{{ item.digest[-12:] }}"
      when: digests_to_write | length > 0

    - name: Compute stale digests for pruning
      vars:
        _failed_tags: "{{ remote_failed_tags | default([]) | map('string') | list }}"
        _digests_protected_by_failed_tags: >-
          {%- set ns = namespace(digests=[]) -%}
          {%- for digest, image in existing_images_by_digest.items() -%}
            {%- set tags = image.image_tags | default(image.tags | default([])) | map('string') | list -%}
            {%- if (tags | select('in', _failed_tags) | list | length) > 0 -%}
              {%- set _ = ns.digests.append(digest) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.digests }}
      ansible.builtin.set_fact:
        stale_digests: >-
          {{
            existing_images_by_digest.keys() | list
            | difference(remote_images_by_digest.keys() | list)
            | difference(_digests_protected_by_failed_tags)
          }}

    - name: Skip prune when tag inspects failed
      ansible.builtin.debug:
        msg: >-
          Skipping prune for {{ discover_image_path }}:
          {{ remote_failed_tags | length }} tag(s) failed inspect, so the remote
          digest set may be incomplete.
      when:
        - image_inspector_prune_images | bool
        - remote_failed_tags | default([]) | length > 0

    - name: Remove pruned digest vars files
      ansible.builtin.file:
        path: "{{ vars_dir }}/{{ item | regex_replace('^sha256:', '') }}.yml"
        state: absent
      loop: "{{ stale_digests }}"
      loop_control:
        label: "{{ item[-12:] }}"
      when:
        - image_inspector_prune_images | bool
        - remote_failed_tags | default([]) | length == 0
